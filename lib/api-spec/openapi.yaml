          type: string
        groupId:
          type: ["integer", "null"]
        lastMessage:
          type: ["string", "null"]
        lastMessageAt:
          type: ["string", "null"]
        unreadCount:
          type: integer
        archived:
          type: boolean
          description: Whether the calling participant archived this room
        otherLastSeenAt:
          type: ["string", "null"]
          description: For direct rooms — the other member's last-seen timestamp
        otherOnline:
          type: boolean
          description: For direct rooms — whether the other member was seen in the last 90s
        createdAt:
          type: string
      required:
        - id
        - type
        - name
        - unreadCount
        - createdAt

    ChatMessageItem:
      type: object
      properties:
        id:
          type: integer
        roomId:
          type: integer
        senderClerkId:
          type: string
        senderName:
          type: string
        content:
          type: ["string", "null"]
        fileObjectPath:
          type: ["string", "null"]
        fileName:
          type: ["string", "null"]
        fileMimeType:
          type: ["string", "null"]
        fileSizeBytes:
          type: ["integer", "null"]
        encryptedIv:
          type: ["string", "null"]
        messageType:
          type: string
          description: text | system | poll | contact — contact messages carry a JSON contact card in content (encrypted when the room is E2EE)
        createdAt:
          type: string
      required:
        - id
        - roomId
        - senderClerkId
        - senderName
        - createdAt

    ChatRoomMember:
