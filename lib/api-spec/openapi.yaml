        role:
          type: string
          enum: [host, cohost, participant, guest]
        status:
          type: string
          enum: [waiting, admitted, active, left, removed, denied]
        isMuted:
          type: boolean
        isVideoOff:
          type: boolean
        isHandRaised:
          type: boolean
        displayName:
          type: string

