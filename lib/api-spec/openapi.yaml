openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TanCom video conferencing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: meetings
    description: Meeting operations
  - name: participants
    description: Participant management
  - name: recordings
    description: Meeting recordings
  - name: contacts
    description: User contacts
  - name: groups
    description: Contact groups
  - name: chat
    description: Chat messaging
  - name: storage
    description: Object storage upload and serving endpoints
  - name: profile
    description: User profile operations
  - name: admin
    description: Admin operations
  - name: dashboard
    description: Dashboard summary
  - name: notes
    description: Meeting notes and AI summaries
  - name: live
    description: Live Marketing — live video streaming

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/upcoming-meetings:
    get:
      operationId: getUpcomingMeetings
      tags: [dashboard]
      summary: Get upcoming meetings for current user
      responses:
        "200":
          description: List of upcoming meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent meeting activity
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── Meetings ─────────────────────────────────────────────────────────────────
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meetings for current user
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [upcoming, past, all]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Create a new meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingBody"
      responses:
        "201":
          description: Meeting created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  /meetings/{id}:
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: Get a meeting by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meeting details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMeeting
      tags: [meetings]
      summary: Update a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetingBody"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMeeting
      tags: [meetings]
      summary: Delete a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /meetings/join/{meetingCode}:
    get:
      operationId: getMeetingByCode
      tags: [meetings]
      summary: Get meeting by meeting code/ID for joining
      parameters:
        - name: meetingCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Meeting details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /meetings/{id}/start:
    post:
      operationId: startMeeting
      tags: [meetings]
      summary: Start (or mark as active) a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meeting started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  /meetings/{id}/end:
    post:
      operationId: endMeeting
      tags: [meetings]
      summary: End a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meeting ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  /meetings/{id}/lock:
    post:
      operationId: lockMeeting
      tags: [meetings]
      summary: Lock or unlock a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockMeetingBody"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  # ─── Participants ─────────────────────────────────────────────────────────────
  /meetings/{id}/participants:
    get:
      operationId: listParticipants
      tags: [participants]
      summary: List participants for a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participant"
    post:
      operationId: joinMeeting
      tags: [participants]
      summary: Join a meeting as a participant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinMeetingBody"
      responses:
        "201":
          description: Participant joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"

  /meetings/{id}/participants/{participantId}:
    patch:
      operationId: updateParticipant
      tags: [participants]
      summary: Update participant status (mute, video, role, admit, remove)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateParticipantBody"
      responses:
        "200":
          description: Updated participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
    delete:
      operationId: removeParticipant
      tags: [participants]
      summary: Remove a participant from meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /meetings/{id}/participants/admit-all:
    post:
      operationId: admitAllParticipants
      tags: [participants]
      summary: Admit all waiting room participants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: All admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /meetings/{id}/participants/mute-all:
    post:
      operationId: muteAllParticipants
      tags: [participants]
      summary: Mute all participants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: All muted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── Recordings ───────────────────────────────────────────────────────────────
  /recordings:
    get:
      operationId: listRecordings
      tags: [recordings]
      summary: List recordings accessible to the current user
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"

  /recordings/{id}:
    get:
      operationId: getRecording
      tags: [recordings]
      summary: Get a recording by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recording details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRecording
      tags: [recordings]
      summary: Delete a recording
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /meetings/{id}/recordings:
    post:
      operationId: createRecording
      tags: [recordings]
      summary: Start a recording for a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordingBody"
      responses:
        "201":
          description: Recording started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"

  /recordings/{id}/stop:
    post:
      operationId: stopRecording
      tags: [recordings]
      summary: Stop a recording
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recording stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"

  # ─── Meeting Notes ────────────────────────────────────────────────────────────
  /meetings/{id}/notes:
    get:
      operationId: listMeetingNotes
      tags: [notes]
      summary: List notes for a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of meeting notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingNote"
    post:
      operationId: createMeetingNote
      tags: [notes]
      summary: Create a meeting note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingNoteBody"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingNote"

  /meetings/{id}/notes/export:
    get:
      operationId: exportMeetingNotes
      tags: [notes]
      summary: Export meeting notes as Markdown text
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Markdown text of all notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  markdown:
                    type: string
                required:
                  - markdown

  /meetings/{id}/notes/{noteId}:
    put:
      operationId: updateMeetingNote
      tags: [notes]
      summary: Update a meeting note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetingNoteBody"
      responses:
        "200":
          description: Note updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingNote"
    delete:
      operationId: deleteMeetingNote
      tags: [notes]
      summary: Delete a meeting note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Note deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /meetings/{id}/summary:
    get:
      operationId: getMeetingSummary
      tags: [notes]
      summary: Get AI-generated summary for a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meeting summary (null if not yet generated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingSummary"
    post:
      operationId: generateMeetingSummary
      tags: [notes]
      summary: Generate AI summary from meeting notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingSummary"

  /notes/polish:
    post:
      tags: [notes]
      summary: Polish dictated text using AI
      operationId: polishNoteText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                noteType:
                  type: string
                  enum: [note, action, decision, highlight]
              required: [content, noteType]
      responses:
        "200":
          description: Polished text
          content:
            application/json:
              schema:
                type: object
                properties:
                  polished:
                    type: string
                required: [polished]

  # ─── Contacts ────────────────────────────────────────────────────────────────
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List user's contacts
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactBody"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact (edit fields or toggle favorite/pin/block/mute)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactBody"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Remove a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contacts/{id}/profile:
    get:
      operationId: getContactProfile
      tags: [contacts]
      summary: Rich profile for a contact (TanCom profile if registered)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact with optional TanCom profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactProfileResponse"

  /users/search:
    get:
      operationId: searchUsers
      tags: [contacts]
      summary: Search TanCom users by exact email or username prefix (always returns an array)
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: username
          in: query
          required: false
          schema:
            type: string
            description: Username prefix (min 2 chars)
      responses:
        "200":
          description: Matching users (empty array when no match)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchResult"

  /profile/username-available:
    get:
      operationId: checkUsernameAvailable
      tags: [profile]
      summary: Check whether a username is valid and available
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  valid:
                    type: boolean
                required: [available, valid]

  /presence/heartbeat:
    post:
      operationId: presenceHeartbeat
      tags: [profile]
      summary: Update the caller's last-seen timestamp (call ~every 30s while active)
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  # ─── Groups ───────────────────────────────────────────────────────────────────
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List my groups
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}:
    patch:
      operationId: patchGroup
      tags: [groups]
      summary: Update group name, description, or require-approval setting
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGroupBody"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /groups/{groupId}/mute:
    post:
      operationId: muteGroup
      tags: [groups]
      summary: Mute notifications for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group muted
    delete:
      operationId: unmuteGroup
      tags: [groups]
      summary: Unmute notifications for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group unmuted

  /groups/{groupId}/join-requests:
    get:
      operationId: listGroupJoinRequests
      tags: [groups]
      summary: List pending join requests (owner/admin only)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of pending join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupJoinRequest"
    post:
      operationId: submitGroupJoinRequest
      tags: [groups]
      summary: Submit a join request for a require-approval group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Join request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupJoinRequestResult"

  /groups/{groupId}/join-requests/{requestId}/approve:
    post:
      operationId: approveGroupJoinRequest
      tags: [groups]
      summary: Approve a join request (owner/admin only)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request approved

  /groups/{groupId}/join-requests/{requestId}/reject:
    post:
      operationId: rejectGroupJoinRequest
      tags: [groups]
      summary: Reject a join request (owner/admin only)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request rejected

  /groups/{groupId}/posts/pinned:
    get:
      operationId: listPinnedGroupPosts
      tags: [groups]
      summary: List pinned posts in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pinned posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupPost"

  /groups/{groupId}/posts/{postId}/pin:
    post:
      operationId: pinGroupPost
      tags: [groups]
      summary: Pin a group post (owner/admin only)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post pinned
    delete:
      operationId: unpinGroupPost
      tags: [groups]
      summary: Unpin a group post (owner/admin only)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post unpinned

  /groups/{groupId}/invite-token/regenerate:
    post:
      operationId: regenerateGroupInviteToken
      tags: [groups]
      summary: Revoke the current invite link and generate a new one
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New invite token generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInviteLink"

  /groups/{groupId}/leave:
    delete:
      operationId: leaveGroup
      tags: [groups]
      summary: Leave a group you are a member of
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Left the group

  /groups/{groupId}/members:
    get:
      operationId: listGroupMembers
      tags: [groups]
      summary: List members of a group
      parameters:
        - name: groupId
