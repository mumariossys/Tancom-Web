        - meetingId
        - displayName
        - role
        - status
        - isMuted
        - isVideoOff
        - isHandRaised

    JoinMeetingBody:
      type: object
      properties:
        displayName:
          type: string
        passcode:
          type: string
        clerkId:
          type: string
