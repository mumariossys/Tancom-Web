          type: integer
        meetingId:
          type: integer
        meetingTitle:
          type: string
        status:
          type: string
          enum: [recording, stopped, processing, available, failed]
        fileUrl:
          type: ["string", "null"]
        fileSizeBytes:
          type: ["integer", "null"]
        durationSeconds:
          type: ["integer", "null"]
        startedAt:
          type: string
        stoppedAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - meetingId
        - meetingTitle
        - status
        - startedAt
        - createdAt

    CreateRecordingBody:
      type: object
