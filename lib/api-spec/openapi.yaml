    SendMessageBody:
      type: object
      properties:
        content:
          type: string
        encryptedIv:
          type: string
        fileObjectPath:
          type: string
        fileName:
          type: string
        fileMimeType:
          type: string
        fileSizeBytes:
          type: integer
        messageType:
          type: string
          enum: [text, contact]
          description: Defaults to text. For contact — either send content+encryptedIv (E2EE, ciphertext of the card JSON) or a plaintext contactCard fallback.
