      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    Meeting:
      type: object
      properties:
        id:
          type: integer
        meetingCode:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        hostClerkId:
          type: string
        hostName:
          type: string
        status:
          type: string
          enum: [scheduled, active, ended, cancelled]
        type:
          type: string
          enum: [instant, scheduled, recurring]
        scheduledAt:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
        endedAt:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        plannedDuration:
          type: ["integer", "null"]
        timezone:
          type: string
        passcode:
          type: ["string", "null"]
        isPasswordProtected:
          type: boolean
        waitingRoomEnabled:
          type: boolean
        isLocked:
          type: boolean
        maxParticipants:
          type: ["integer", "null"]
        participantCount:
          type: integer
        allowScreenShare:
          type: boolean
        allowChat:
          type: boolean
        muteOnEntry:
          type: boolean
        videoOffOnEntry:
          type: boolean
        recurrencePattern:
          type: ["string", "null"]
          enum: [daily, weekly, monthly, null]
        recurrenceInterval:
          type: ["integer", "null"]
        recurrenceDays:
          type: ["string", "null"]
        recurrenceEndDate:
          type: ["string", "null"]
        recurrenceCount:
          type: ["integer", "null"]
        inviteLink:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - meetingCode
        - title
        - hostClerkId
        - hostName
        - status
        - type
        - timezone
        - isPasswordProtected
        - waitingRoomEnabled
        - isLocked
        - participantCount
        - allowScreenShare
        - allowChat
        - muteOnEntry
        - videoOffOnEntry
        - inviteLink
        - createdAt
        - updatedAt

    CreateMeetingBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [instant, scheduled, recurring]
        scheduledAt:
          type: string
        plannedDuration:
          type: integer
          description: Planned duration in minutes
        timezone:
          type: string
        passcode:
          type: string
        waitingRoomEnabled:
          type: boolean
        maxParticipants:
          type: integer
        allowScreenShare:
          type: boolean
        allowChat:
          type: boolean
        muteOnEntry:
          type: boolean
        videoOffOnEntry:
          type: boolean
        recurrencePattern:
          type: string
          enum: [daily, weekly, monthly]
          description: Recurrence pattern for recurring meetings
        recurrenceInterval:
          type: integer
          description: Repeat every N days/weeks/months
        recurrenceDays:
          type: string
          description: JSON array of weekday numbers (0=Sun..6=Sat) for weekly recurrence
        recurrenceEndDate:
          type: string
          description: ISO date string when recurrence ends
        recurrenceCount:
          type: integer
          description: Maximum number of occurrences
        groupId:
          type: integer
          description: Optional group ID — auto-invites all accepted group members as participants
      required:
        - title
        - type

    UpdateMeetingBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        scheduledAt:
          type: string
        timezone:
          type: string
        passcode:
          type: string
        waitingRoomEnabled:
          type: boolean
        maxParticipants:
          type: integer
        allowScreenShare:
          type: boolean
        allowChat:
          type: boolean
        muteOnEntry:
          type: boolean
        videoOffOnEntry:
          type: boolean
        status:
          type: string
          enum: [scheduled, active, ended, cancelled]

    LockMeetingBody:
      type: object
      properties:
        locked:
          type: boolean
      required:
        - locked

    Participant:
      type: object
      properties:
        id:
          type: integer
        meetingId:
          type: integer
        clerkId:
          type: ["string", "null"]
        displayName:
          type: string
        role:
          type: string
          enum: [host, cohost, participant, guest]
        status:
          type: string
          enum: [waiting, admitted, active, left, removed, denied]
        isMuted:
          type: boolean
        isVideoOff:
          type: boolean
        isHandRaised:
          type: boolean
        joinedAt:
          type: ["string", "null"]
        leftAt:
          type: ["string", "null"]
      required:
