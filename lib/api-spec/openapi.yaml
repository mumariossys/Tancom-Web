      tags: [live]
      summary: Follow or unfollow a streamer
      parameters:
        - in: path
          name: streamerClerkId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"

  /live/following:
    get:
      operationId: getLiveFollowing
      tags: [live]
      summary: Get streamers the current user follows
      responses:
        "200":
          description: Following list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FollowedStreamer"

  /live/followers:
    get:
      operationId: getLiveFollowers
      tags: [live]
      summary: Get followers of the current user
      responses:
        "200":
          description: Followers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowersResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
