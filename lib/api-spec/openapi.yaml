          type: string
      required:
        - initiatedByClerkId

    Contact:
      type: object
      properties:
        id:
          type: integer
        ownerClerkId:
          type: string
        contactClerkId:
          type: ["string", "null"]
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        createdAt:
          type: string
        isFavorite:
          type: boolean
        isPinned:
          type: boolean
        isBlocked:
          type: boolean
        isMuted:
          type: boolean
        category:
          type: ["string", "null"]
          description: One of family, friend, work, client, vendor — or null
        labels:
          type: array
          items:
            type: string
      required:
        - id
        - ownerClerkId
        - name
        - email
        - createdAt

    UpdateContactBody:
      type: object
      description: At least one field must be provided.
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        isFavorite:
          type: boolean
        isPinned:
          type: boolean
        isBlocked:
          type: boolean
        isMuted:
          type: boolean
        category:
          type: ["string", "null"]
          description: One of family, friend, work, client, vendor — or null to clear
        labels:
          type: array
          items:
            type: string
          description: Full replacement list (max 20 labels, 30 chars each)

    ContactProfileResponse:
      type: object
      properties:
        contact:
          $ref: "#/components/schemas/Contact"
        profile:
          type: ["object", "null"]
          properties:
            name:
              type: string
            email:
              type: string
            username:
              type: ["string", "null"]
            bio:
              type: ["string", "null"]
            lastLoginAt:
              type: ["string", "null"]
            lastSeenAt:
              type: ["string", "null"]
          required:
            - name
            - email
        online:
          type: boolean
          description: Whether the contact was seen within the last 90 seconds
      required:
        - contact
        - profile
        - online

    UserSearchResult:
      type: object
      properties:
        clerkId:
          type: string
        name:
          type: string
        email:
          type: string
        username:
          type: ["string", "null"]
      required: [clerkId, name, email]

    ContactCardInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: ["string", "null"]
          maxLength: 30
          pattern: '^[+\d\s().\/\-]{0,30}$'
        username:
          type: ["string", "null"]
          maxLength: 50
          pattern: '^[\w.\-@]{1,50}$'
        contactClerkId:
          type: ["string", "null"]
          maxLength: 128
      required: [name, email]

    CreateContactBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        contactClerkId:
          type: string
      required:
